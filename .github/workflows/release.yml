name: release

# On a version tag (v1.0, v1.1, ...): build the site, the templates and the PDF
# edition, and attach the PDF and a ZIP of the templates to a GitHub release.
# A published release is what Zenodo archives (and gives a DOI to) once the
# repository is enabled in Zenodo's GitHub settings.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install Chromium (tests and PDF)
        run: python -m playwright install --with-deps chromium
      - name: Build the templates
        run: python scripts/build_templates.py --force
      - name: Generate pages and check every step
        run: python scripts/build_pages.py && python scripts/check_workflows.py && python scripts/check_regulations.py
      - name: Test
        run: pytest -q
      - run: mkdocs build --strict
      - name: Build the PDF edition
        run: python scripts/build_pdf.py --site site --out "esg-workflows-handbook-${TAG}.pdf" --version "${TAG#v}"
      - name: Pack the templates
        run: cd docs/downloads && zip -q "../../esg-workflows-handbook-templates-${TAG}.zip" *
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="esg-workflows-handbook-${TAG}.pdf esg-workflows-handbook-templates-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "ESG Workflows Handbook ${TAG}" \
              --notes "PDF edition and templates. See the changelog: https://mantas123456.github.io/esg-workflows-handbook/changelog/ . Self-reviewed by its author; not yet reviewed by an external practitioner. Not legal advice."
          fi
