# Fictional worked example used through the Scope 3 track (S1-S9, F2).
# Gozo Fresh Foods Ltd, Malta. All companies and numbers are made up.
# Every number shown on a page is recomputed from this file by
# tests/test_examples_scope3.py using esgcalc.

company:
  name: Gozo Fresh Foods Ltd
  country: Malta
  activity: Food processing (prepared vegetables, sauces and ready meals)
  employees: 140
  reporting_year: 2026
  request: A large supermarket chain that reports under the CSRD asks for the company's Scope 3 emissions.

# S1: the group and its links. Scope 1 and 2 at 100% of each entity, tCO2e, 2026.
entities:
  - {name: Gozo Fresh Foods Ltd (processing plant), scope12_tco2e: 1200, equity_share: 1.00, financial_control: true, operational_control: true}
  - {name: Gozo Fresh Logistics Ltd, scope12_tco2e: 400, equity_share: 0.60, financial_control: true, operational_control: true}
  - {name: Harbour Packing Ltd (joint venture run by Gozo Fresh Foods), scope12_tco2e: 200, equity_share: 0.50, financial_control: false, operational_control: true}
  - {name: Island Cold Store Ltd (associate), scope12_tco2e: 300, equity_share: 0.25, financial_control: false, operational_control: false}
chosen_approach: operational_control

# S2: screening estimates for 2026. Rough data and MADE-UP factors for
# illustration (S5 shows where to find real ones). Units:
#   spend_based: spend_eur x factor (kg CO2e per EUR)
#   average_data: activity x factor (kg CO2e per unit of activity)
#   supplier_specific: supplier_total_tco2e x purchased / total
screening:
  size_threshold_share: 0.02          # Gozo Fresh Foods' own choice: 2% of the screened total
  lines:
    - {category: 1, description: "Ingredients", method: spend_based, spend_eur: 6000000, factor: 0.9}
    - {category: 1, description: "Packaging", method: spend_based, spend_eur: 1500000, factor: 0.6}
    - {category: 1, description: "Services (cleaning, IT, maintenance)", method: spend_based, spend_eur: 500000, factor: 0.15}
    - {category: 2, description: "Machinery and equipment bought in 2026", method: spend_based, spend_eur: 400000, factor: 0.4}
    - {category: 3, description: "Upstream emissions of purchased electricity (3,000 MWh)", method: average_data, activity: 3000, unit: MWh, factor: 40}
    - {category: 3, description: "Upstream emissions of fuels burned (2,000 MWh)", method: average_data, activity: 2000, unit: MWh, factor: 30}
    - {category: 4, description: "Inbound road freight by hauliers", method: average_data, activity: 900000, unit: tonne.km, factor: 0.10}
    - {category: 4, description: "Chilled storage at Island Cold Store (30% of its capacity)", method: supplier_specific, supplier_total_tco2e: 300, purchased: 30, total: 100}
    - {category: 5, description: "Food waste to anaerobic digestion", method: average_data, activity: 600000, unit: kg, factor: 0.01}
    - {category: 5, description: "General waste to landfill", method: average_data, activity: 50000, unit: kg, factor: 0.5}
    - {category: 6, description: "Flights and hotels", method: spend_based, spend_eur: 40000, factor: 0.25}
    - {category: 7, description: "Commuting by car: 140 staff x 220 days x 30 km", method: average_data, activity: 924000, unit: km, factor: 0.17}
    - {category: 9, description: "Chilled storage of Gozo products at the supermarket", method: average_data, activity: 3000000, unit: kg, factor: 0.03}
    - {category: 9, description: "Supermarket transport to its stores", method: average_data, activity: 360000, unit: tonne.km, factor: 0.10}
    - {category: 12, description: "Packaging thrown away by consumers", method: average_data, activity: 300000, unit: kg, factor: 0.4}
    - {category: 12, description: "Food wasted by consumers", method: average_data, activity: 150000, unit: kg, factor: 0.5}
    - {category: 15, description: "25% equity in Island Cold Store (Scope 1 and 2: 300 t)", method: supplier_specific, supplier_total_tco2e: 300, purchased: 25, total: 100}
  not_applicable:
    8: No leased assets outside the boundary. The warehouse Gozo leases is operated by Gozo, so it is in Scope 1 and 2.
    10: Products are sold ready to heat or eat. Nobody processes them further.
    11: Food products use no energy and release no gases in use. Home cooking and refrigeration are not estimated.
    13: Gozo leases out no assets.
    14: Gozo has no franchises.
  other_reasons:
    9: The supermarket asked for it, and Gozo can reduce it through packaging and shelf life.

# S3: data collection plan. Ingredient spend 2026 by supplier, EUR (made up; sums to 6,000,000).
ingredient_spend_by_supplier:
  Maltese Farmers Cooperative: 1800000
  Sicilian Tomato Co: 1200000
  Gozo Greens Ltd: 900000
  Island Dairy Ltd: 700000
  Mediterranean Oils: 500000
  Spice Traders Ltd: 300000
  Valletta Grain Mill: 250000
  Ghajnsielem Egg Farm: 200000
  Herb Garden Gozo: 100000
  Other small suppliers: 50000
supplier_target_share: 0.80
inventory_deadline: 2027-04-30     # the supermarket wants the 2026 inventory by this date
data_plan:     # one row per significant category from S2
  - {category: 1, data: "Spend by supplier; tonnes bought from the top 5 ingredient suppliers; their emissions data; packaging tonnes by material", screening: Spend-based, target: "Supplier-specific for the top 5 ingredient suppliers; average-data for packaging; spend-based for the rest", owner: Purchasing, source: "Purchase ledger, supplier questionnaires (S7), packaging specifications", ready_by: 31 Mar 2027}
  - {category: 2, data: "Assets bought in 2026, by type and cost", screening: Spend-based, target: Spend-based, owner: Finance, source: Fixed asset register, ready_by: 31 Jan 2027}
  - {category: 3, data: "MWh of electricity and of each fuel", screening: Average-data, target: "Average-data with sourced factors (S5)", owner: Facilities, source: Energy invoices and meter readings, ready_by: 31 Jan 2027}
  - {category: 4, data: "Tonne.km per haulier; Island Cold Store's emissions and Gozo's share of its capacity", screening: "Average-data and supplier-specific", target: "Average-data from haulier records; supplier-specific for the cold store", owner: Logistics, source: "Haulier invoices, Island Cold Store's emissions report", ready_by: 28 Feb 2027}
  - {category: 7, data: "Distance, transport mode and days on site per employee", screening: "Average-data (estimate)", target: Average-data from a staff survey, owner: HR, source: Staff survey, ready_by: 31 Jan 2027}
  - {category: 9, data: "Storage time and transport distance of Gozo products at the supermarket", screening: "Average-data (estimate)", target: Average-data from the supermarket's figures, owner: Sales, source: The supermarket, ready_by: 28 Feb 2027}
  - {category: 12, data: "Packaging tonnes by material; share of food wasted by consumers", screening: Average-data, target: Average-data with material-specific factors, owner: Quality and packaging, source: "Packaging specifications, published food-waste studies", ready_by: 31 Jan 2027}
