# Regulatory facts the handbook relies on. check_workflows.py warns when
# last_checked is older than 90 days. Update the date only after re-reading
# the source.

# --- CSRD / ESRS (Omnibus I) ---
- id: omnibus-i
  fact: Omnibus I Directive (EU) 2026/470 published in the OJ on 26 Feb 2026, in force 18 Mar 2026
  source: https://eur-lex.europa.eu/eli/dir/2026/470/oj/eng
  last_checked: 2026-11-20
- id: omnibus-i-transposition
  fact: Member States must transpose the CSRD changes (Articles 1-3 of Directive (EU) 2026/470) by 19 Mar 2027, and the CSDDD changes (Article 4) by 26 Jul 2028
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ%3AL_202600470
  last_checked: 2026-11-20
- id: csrd-scope
  fact: "CSRD applies to undertakings that, on their balance sheet dates, exceed a net turnover of EUR 450 m and an average number of 1,000 employees during the financial year (both conditions, Article 19a(1)); a parent undertaking of a group reports on a consolidated basis when the group exceeds the same two thresholds on a consolidated basis (Article 29a(1)); the information goes in a dedicated section of the (consolidated) management report"
  article: "Directive 2013/34/EU, Articles 19a(1) and 29a(1), as amended by Directive (EU) 2026/470"
  source: https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng
  values: {min_employees_exclusive: 1000, min_turnover_eur_exclusive: 450000000}
  last_checked: 2026-11-21
- id: csrd-subsidiary-exemption
  fact: "A subsidiary undertaking is exempted from its own sustainability reporting where it and its subsidiaries are included in the consolidated management report of its parent undertaking drawn up under Articles 29 and 29a, or in the consolidated sustainability reporting of a third-country parent made in accordance with the ESRS or an equivalent standard, subject to the conditions set out in Article 19a(9)"
  article: "Directive 2013/34/EU, Article 19a(9), as amended"
  source: https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng
  last_checked: 2026-11-21
- id: csrd-third-country
  fact: "An EU subsidiary of a third-country ultimate parent, with net turnover above EUR 200 m in the preceding financial year, or (where there is no such subsidiary) an EU branch of a third-country undertaking with net turnover above EUR 200 m, publishes a sustainability report at the group level of the third-country undertaking, where that undertaking generated a net turnover in the Union above EUR 450 m in each of the last two consecutive financial years; the report follows standards adopted under Article 40b"
  article: "Directive 2013/34/EU, Article 40a(1) and (2), as amended by Directive (EU) 2026/470"
  source: https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng
  last_checked: 2026-11-21
- id: csrd-wave1-exemption
  fact: Companies reporting from FY2024 (wave 1) that fall below the new thresholds leave CSRD scope from FY2027; Member States may exempt them for financial years starting 1 Jan 2025 to 31 Dec 2026 (an option, not automatic)
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ%3AL_202600470
  last_checked: 2026-11-20
- id: esrs-simplified
  fact: Revised ESRS adopted 3 Jul 2026 as Delegated Regulation (EU) 2026/1563, amending Delegated Regulation (EU) 2023/2772, published in the OJ 21 Sep 2026, in force 10 Nov 2026; mandatory for financial years starting on or after 1 Jan 2027, optional for financial years starting in 2026 (the undertaking says which version it used)
  article: Delegated Regulation (EU) 2026/1563, Articles 1 and 2
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ%3AL_202601563
  last_checked: 2026-11-20
- id: esrs-structure
  fact: "The revised ESRS are 12 standards: two cross-cutting standards, ESRS 1 (general requirements) and ESRS 2 (general disclosures: governance, strategy including financial effects, management of impacts, risks and opportunities, metrics and targets), and ten topical standards, E1 to E5, S1 to S4 and G1; reporting follows the double materiality principle, covering material impacts on people and the environment and material sustainability-related risks and opportunities; ESRS 2 asks for a concise description of the materiality assessment process, including how it covers own operations and the value chain"
  article: Delegated Regulation (EU) 2026/1563, Annex I (ESRS 1, ESRS 2)
  source: https://knowledgehub.efrag.org/interactive/simplified-esrs/esrs-1
  last_checked: 2026-11-20
- id: esrs-phase-in
  fact: "ESRS 1 chapter 10 sets the transitional provisions. 'Other undertakings' (required to report from financial years starting on or after 1 January 2027) may omit: all DRs of E4, S2, S3 and S4 for their first two financial years; anticipated financial effects (ESRS 2 paragraph 27 and E1-11) for their first two years, except E1-11 paragraphs 39(a)(b) and 40(a)(b); quantitative anticipated financial effects for their first four years (same exception); quantitative information on substances of concern (E2-5) for their first three years; information on substances of very high concern in articles they use for their first year; S1-6, S1-7 for employees outside the EEA, S1-10, S1-11, S1-12, S1-13 paragraph 37(d) and (e) and non-employee datapoints, and S1-14 for their first year; comparative information for their first year. For their first three financial years, where not all value-chain information is available, they explain their efforts, why it could not be obtained, and their plans. Earlier voluntary use does not start the phase-in clock. Undertakings using a phase-in say so (BP-2). No phase-in specific to Scope 3 exists"
  article: "Delegated Regulation (EU) 2026/1563, Annex I, ESRS 1 paragraphs 121 to 127, and ESRS 2 BP-2"
  source: https://eur-lex.europa.eu/eli/reg_del/2026/1563/oj/eng
  last_checked: 2026-11-21
- id: esrs-dma-method
  fact: "Impact materiality: the severity of an impact is assessed on its scale, scope and irremediable character, and any one of the three can make a negative impact severe; actual negative impacts are assessed on severity, potential negative impacts on severity and likelihood, and for potential human rights impacts severity takes precedence over likelihood; actual positive impacts on scale and scope, potential positive impacts on scale, scope and likelihood; prevention and mitigation count only if already implemented and reasonably assumed to be effective. Financial materiality: a topic is material if it triggers, or could reasonably be expected to trigger, material financial effects over the short, medium or long term; material risks and opportunities can arise from material impacts. The undertaking decides materiality with qualitative considerations and quantitative thresholds it sets; the ESRS give no numeric thresholds"
  article: Delegated Regulation (EU) 2026/1563, Annex I, ESRS 1 chapter 3 (impact and financial materiality)
  source: https://knowledgehub.efrag.org/eng/interactive/simplified-esrs/esrs-1/2026-09-21-official-journal
  last_checked: 2026-11-20
- id: csrd-assurance
  fact: "After Omnibus I, sustainability statements need limited assurance only: the planned move to reasonable assurance was removed; the Commission's deadline to adopt limited assurance standards is 1 July 2027 (moved from 1 October 2026); the Commission opened a consultation on draft limited assurance standards on 12 November 2026"
  article: Directive 2006/43/EC and Directive 2013/34/EU as amended by Directive (EU) 2026/470
  source: https://finance.ec.europa.eu/news/commission-seeks-feedback-limited-assurance-standards-sustainability-reporting-2026-11-12_en
  last_checked: 2026-11-20
- id: csrd-assurance-scope
  fact: "The statutory auditor or audit firm expresses an opinion based on a limited assurance engagement on the compliance of the sustainability reporting with the Directive, including compliance with the ESRS, the process carried out by the undertaking to identify the information reported, compliance with the marking-up requirement of Article 29d, and compliance with Article 8 of Regulation (EU) 2020/852; the opinion must fully respect the right of value-chain undertakings with on average 1,000 employees or fewer to decline information beyond the voluntary standard; Member States may allow a different statutory auditor, or an independent assurance services provider, to give the opinion"
  article: "Directive 2013/34/EU, Article 34(1), second subparagraph, point (aa), and Article 34(2a), (3) and (4), as amended by Directive (EU) 2026/470"
  source: https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng
  last_checked: 2026-11-21
- id: csrd-management-report
  fact: "Sustainability reporting is clearly identifiable within the management report (or consolidated management report), through a dedicated section; the management report is prepared in the electronic reporting format of Article 3 of Delegated Regulation (EU) 2019/815, and the sustainability reporting, including the disclosures under Article 8 of Regulation (EU) 2020/852, is to be marked up in that format; until the marking-up rules are adopted in that Delegated Regulation, undertakings are not required to mark up their sustainability reporting"
  article: "Directive 2013/34/EU, Articles 19a(1), 29a(1) and 29d, as amended by Directive (EU) 2026/470"
  source: https://eur-lex.europa.eu/eli/dir/2013/34/2026-03-18/eng
  last_checked: 2026-11-21
- id: eu-taxonomy-article8
  fact: "Undertakings subject to Article 19a or 29a of Directive 2013/34/EU disclose how and to what extent their activities are associated with environmentally sustainable economic activities under the Taxonomy Regulation; non-financial undertakings disclose the proportion of their turnover, capital expenditure and operating expenditure associated with such activities; a delegated act specifies content, presentation and methodology; the disclosures are covered by the assurance opinion and the marking-up requirement"
  article: "Regulation (EU) 2020/852, Article 8(1), (2) and (4); Directive 2013/34/EU, Articles 29d and 34"
  source: https://eur-lex.europa.eu/eli/reg/2020/852/oj/eng
  last_checked: 2026-11-21
- id: esrs-digital-tagging
  fact: "Digital (XBRL) tagging of ESRS sustainability statements is not yet mandatory and is not expected for financial year 2026: EFRAG published a draft XBRL taxonomy for the revised ESRS, with consultation until 11 November 2026, and plans to hand the final taxonomy to ESMA and the Commission by the end of 2026; ESMA then drafts tagging rules (RTS) and the Commission adopts them by amending the ESEF Regulation (Delegated Regulation (EU) 2019/815)"
  article: Delegated Regulation (EU) 2019/815 (ESEF), to be amended
  source: https://www.efrag.org/en/news-and-calendar/news/efrag-releases-draft-esrs-xbrl-taxonomy-for-the-revised-esrs-and-launches-public-consultation
  last_checked: 2026-11-20
- id: malta-csrd
  fact: "Malta transposed the original CSRD through the Corporate Sustainability Reporting Regulations, 2026 (Legal Notice 39 of 2026, Government Gazette 13 February 2026, made under the Companies Act, Cap. 386); regulation 1(2) says they come into force on dates the Minister sets by notice in the Gazette, and no such commencement notice was found; Legal Notice 61 of 2026 (Gazette 20 March 2026) brought into force articles 17, 26 to 29, 31, 41 and 42 of Act I of 2026 (Various Laws relating to Corporate Sustainability Reporting (Amendment) Act, 2026); no Maltese law transposing Omnibus I (Directive (EU) 2026/470) was found; the transposition deadline is 19 March 2027"
  article: "Legal Notice 39 of 2026, regulation 1(2); Legal Notice 61 of 2026; Directive (EU) 2026/470 (transposition deadline)"
  source: https://legislation.mt/eli/ln/2026/39/eng
  last_checked: 2026-11-21
- id: csrd-stop-the-clock
  fact: "The 'stop-the-clock' Directive (EU) 2025/794 (adopted 14 April 2025, published 16 April 2025, to be transposed by 31 December 2025) postponed by two years the CSRD start for large companies that had not yet started reporting (the second and third waves) and for listed SMEs; those companies are not subject to the reporting requirements for financial years 2025 or 2026, so a large company still in scope after Omnibus I that never reported starts with financial year 2027"
  article: Directive (EU) 2025/794
  source: https://eur-lex.europa.eu/eli/dir/2025/794/oj/eng
  last_checked: 2026-11-20
- id: csrd-value-chain-cap
  fact: "Companies reporting under the CSRD may not require value-chain companies with on average 1,000 employees or fewer (previous financial year, headcount only) to give more information than the voluntary standard covers (the datapoints in Annex II of Delegated Regulation (EU) 2026/1560); a reporting company that asks for more must say which information goes beyond the cap and tell the value-chain company that it has a right to refuse it; it may rely on the value-chain company's self-declaration of size unless it knows or should know it is manifestly wrong; the cap creates no duty to report, does not stop voluntary sharing of information commonly shared in a sector, and does not override existing contractual or legal duties; it applies to value-chain reporting from financial year 2027; the cap comprises only the datapoints listed in Annex II of Delegated Regulation (EU) 2026/1560, which lists fewer datapoints for undertakings with 10 employees or fewer (for example, energy and GHG emissions are within the cap only for undertakings with more than 10 employees); Article 3 of that Regulation applies from financial years beginning on or after 1 January 2027"
  article: "Directive 2013/34/EU, Article 29b(4), as amended by Directive (EU) 2026/470; Delegated Regulation (EU) 2026/1560, Annex II"
  source: https://finance.ec.europa.eu/news/feedback-sustainability-reporting-standards-additional-explanatory-information-regarding-value-chain-2026-05-06_en
  values: {max_employees: 1000}
  last_checked: 2026-11-21

# --- VSME / voluntary standard ---
- id: vsme
  fact: "The voluntary sustainability reporting standard is Commission Delegated Regulation (EU) 2026/1560, adopted on 3 July 2026 together with the revised ESRS and published in the Official Journal on 21 September 2026; it enters into force on the third day after publication and applies to financial years beginning on or after 1 January 2027; it is for undertakings with on average 1,000 employees or fewer, is not a legal reporting obligation, requires no assurance, and builds on the VSME standard of Commission Recommendation (EU) 2025/1710"
  article: Delegated Regulation (EU) 2026/1560, Articles 1 and 4 and Annex I
  source: https://eur-lex.europa.eu/eli/reg_del/2026/1560/oj/eng
  last_checked: 2026-11-20
- id: vsme-modules
  fact: "The standard has a Basic Module (disclosures B1 to B11) and a Comprehensive Module (C1 to C9), the latter for information that banks, investors and corporate clients typically ask for; the Basic Module must be applied before the Comprehensive Module; in B1 the undertaking states Option A (Basic Module only) or Option B (Basic and Comprehensive) and makes an explicit statement of compliance; some disclosures are voluntary for undertakings with 10 employees or fewer; compared with the 2025 Recommendation, C7 is now titled 'Human rights incidents' and C8 'Revenues from certain activities'"
  article: Delegated Regulation (EU) 2026/1560, Annex I; Commission explanatory memorandum C(2026) 5011
  source: https://knowledgehub.efrag.org/eng/interactive/voluntary-standard
  last_checked: 2026-11-20
- id: vs-digital-template
  fact: "EFRAG publishes a digital template (Excel) and an XBRL taxonomy for digital reporting under the voluntary standard; per EFRAG's VS page, version 2.0.0 of both was released on 4 November 2026 for the standard published in the Official Journal on 21 September 2026; the earlier VSME template (version 1.3.0, June 2026) reflected the 2025 Recommendation"
  article: EFRAG, VS Digital Template and XBRL Taxonomy
  source: https://www.efrag.org/en/vs-digital-template-and-xbrl-taxonomy
  last_checked: 2026-11-20
- id: vsme-basic-metrics
  fact: "Basic Module metrics include: B3 total energy consumption in MWh, split into renewable and non-renewable where the undertaking can obtain the data, Scope 1 and location-based Scope 2 GHG emissions in tCO2e following the GHG Protocol Corporate Standard, and GHG intensity per unit of turnover (Scope 3 is not required in the Basic Module); B5 number and area of sites in or near biodiversity-sensitive areas (land-use metrics optional); B6 water consumption (withdrawal minus discharge) for undertakings with production processes that use water significantly (a total-withdrawal metric for all undertakings was not confirmed here); B7 waste generated, hazardous and non-hazardous, and waste diverted to recycling or reuse; B8 employees by contract type, gender and country, and turnover rate from 50 employees; B9 number and rate of recordable work-related accidents (per 100 full-time workers, based on 2,000 hours a year) and fatalities; B10 gender pay gap (may be omitted below 150 employees, below 100 from 7 June 2031), share of employees covered by collective bargaining, average training hours by gender; B11 convictions and fines for corruption and bribery. Wording checked in the 2025 Recommendation; the 2026 act keeps the structure, but its detailed wording was not re-read here"
  article: Commission Recommendation (EU) 2025/1710, Annex I (Basic Module); Delegated Regulation (EU) 2026/1560, Annex I
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A32025H1710
  last_checked: 2026-11-20


# --- CBAM ---
# Regulation (EU) 2023/956 as amended by Regulation (EU) 2025/2083. Article
# numbers refer to the consolidated text of 20 Oct 2025 unless stated.
- id: cbam-definitive
  fact: CBAM definitive period started 1 Jan 2026 under Regulation (EU) 2023/956 as amended by Regulation (EU) 2025/2083; the reporting period is the calendar year of import
  article: Regulation (EU) 2023/956, Articles 6 and 36, as amended
  source: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en
  last_checked: 2026-11-20
- id: cbam-goods
  fact: CBAM goods are the CN codes in Annex I in six sectors (cement, electricity, fertilisers, iron and steel, aluminium, hydrogen); where Annex I gives a code shorter than 8 digits, every CN code starting with it is covered; iron and steel include chapter 72 as a whole, with listed exceptions (such as some ferro-alloys), and some chapter 73 goods; aluminium includes headings 7601 to 7616 as listed; electricity is CN 2716 00 00 and hydrogen CN 2804 10 00
  article: Regulation (EU) 2023/956, Article 2(1) and Annex I
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020
  last_checked: 2026-11-20
- id: cbam-iron-steel-scope
  fact: "In Annex I, iron and steel covers chapter 72 except ferro-silicon (7202 2), ferro-silico-manganese (7202 30 00), ferro-silico-chromium (7202 50 00), ferro-molybdenum (7202 70 00), ferro-tungsten and ferro-silico-tungsten (7202 80 00), ferro-titanium and ferro-silico-titanium (7202 91 00), ferro-vanadium (7202 92 00), ferro-niobium (7202 93 00), other ferro-alloys under 7202 99, and heading 7204 (ferrous waste and scrap; remelting scrap ingots); it also covers agglomerated iron ores (2601 12 00) and listed headings of chapter 73"
  article: "Regulation (EU) 2023/956, Annex I, as amended by Regulation (EU) 2025/2083"
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20/eng
  last_checked: 2026-11-21
- id: cbam-exempt-origins
  fact: CBAM does not apply to goods originating in the countries and territories in Annex III point 1 - Iceland, Liechtenstein, Norway and Switzerland, and Buesingen, Heligoland, Livigno, Ceuta and Melilla; precursors originating there count as zero; the Commission can amend the list
  article: Regulation (EU) 2023/956, Article 2(4) and Annex III, point 1
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R0956-20251020
  last_checked: 2026-11-20
- id: cbam-direct-only
  fact: For iron and steel, aluminium and hydrogen (Annex II) only direct emissions count in embedded emissions; for cement and fertilisers, direct and indirect emissions count
  article: Regulation (EU) 2023/956, Article 7 and Annex II
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020
  last_checked: 2026-11-20
- id: cbam-threshold
  fact: An importer is exempt when the net mass of its CBAM goods does not exceed 50 tonnes in a calendar year, all CN codes added together; the exemption does not cover hydrogen or electricity; an exempt importer declares the exemption in its customs declaration; once the threshold is exceeded, obligations cover all goods imported that year, including those imported before
  article: Regulation (EU) 2023/956, Article 2a and Annex VII, as inserted by Regulation (EU) 2025/2083
  source: https://eur-lex.europa.eu/eli/reg/2025/2083/oj/eng
  values: {max_exempt_mass_t: 50}
  last_checked: 2026-11-20
- id: cbam-complex-goods
  fact: Simple goods are made only from inputs and fuels with zero embedded emissions; complex goods are all other goods; a relevant precursor is a good with non-zero embedded emissions inside the system boundaries of a complex good; the embedded emissions of a complex good add those of the relevant precursors, using the mass of precursor consumed (not the mass contained in the product), repeated for precursors that are themselves complex goods; a precursor from the EU (or an exempted country) counts with zero embedded emissions but must still be identified and its quantity reported
  article: Regulation (EU) 2023/956, Annex IV, point 1; Commission Guidance No. 3
  source: https://taxation-customs.ec.europa.eu/document/download/29b9eec7-1a4b-4eb6-ab85-96a0c9e35fd0_en?filename=Guidance+No.+3+-+CBAM+methods+for+the+calculation+of+emissions+embedded+in+goods.pdf
  last_checked: 2026-11-20
- id: cbam-precursor-examples
  fact: Examples of precursors (not the legal list) - for iron and steel products, crude steel, pig iron, direct reduced iron and ferro-alloys appear as precursors in the transitional-period rules (Implementing Regulation (EU) 2023/1773); Commission guidance lists unwrought aluminium and other aluminium products as typical precursors for aluminium products; the binding list for the definitive period is in the current implementing rules and was not re-checked here
  article: Implementing Regulation (EU) 2023/1773, Annex II (transitional period); Commission Guidance No. 3
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A32023R1773
  last_checked: 2026-11-20
- id: cbam-authorisation
  fact: Only an authorised CBAM declarant may import CBAM goods above the threshold (and any hydrogen or electricity); the importer, or an indirect customs representative, applies through the CBAM registry to the competent authority of its Member State; criteria include no serious or repeated infringements, financial and operational capacity, and an EORI number
  article: Regulation (EU) 2023/956, Articles 5, 17 and 25, as amended
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020
  last_checked: 2026-11-20
- id: cbam-guarantee
  fact: "The competent authority shall require a guarantee if the applicant was not established throughout the two financial years preceding the year of the application; the amount is the value of the CBAM certificates the declarant would have to surrender for the imports it reported in its application, after the free allocation adjustment; it is a bank guarantee payable at first demand by a financial institution operating in the Union, or an equivalent; the authority may require an additional or replacement guarantee, and releases it immediately after 30 September of the second year in which the declarant has surrendered certificates"
  article: "Regulation (EU) 2023/956, Article 17(4) to (7), as amended by Regulation (EU) 2025/2083"
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20/eng
  last_checked: 2026-11-21
- id: cbam-authorisation-procedure
  fact: The competent authority assesses an application within 120 calendar days of receipt; when it asks for more information it may extend this by up to 30 calendar days and must say why, up to 180 days in total; before refusing, it tells the applicant and gives up to 30 calendar days to comment; a decision takes effect when it is registered in the CBAM registry and the applicant is notified there
  article: Implementing Regulation (EU) 2025/486, Articles 4, 5 and 7, as amended by Implementing Regulation (EU) 2025/2549
  source: https://eur-lex.europa.eu/eli/reg_impl/2025/486/oj/eng
  values: {decision_days: 120, max_extension_days: 30, max_total_days: 180, refusal_comment_days: 30}
  last_checked: 2026-11-20
- id: cbam-authorisation-transitional-2026
  fact: An importer or indirect customs representative that applied for authorisation by 31 March 2026 may keep importing CBAM goods in 2026, also above the threshold, until the decision on its application takes effect (the recital says "submitted", the implementing act says "registered in the CBAM registry" by that date)
  article: Regulation (EU) 2023/956, Article 17(7a), as inserted by Regulation (EU) 2025/2083; Implementing Regulation (EU) 2025/2549
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32025R2549
  values: {apply_by: 2026-03-31}
  last_checked: 2026-11-20
- id: cbam-certificate-unit
  fact: One CBAM certificate corresponds to one tonne of CO2e of embedded emissions
  article: Regulation (EU) 2023/956, Article 3
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02023R0956-20251020
  values: {tco2e_per_certificate: 1}
  last_checked: 2026-11-20
- id: cbam-default-values
  fact: Legally binding default values for the definitive period are in Implementing Regulation (EU) 2025/2621, corrected by Implementing Regulation (EU) 2026/1740; default values are increased by a mark-up of 10% in 2026, 20% in 2027 and 30% from 2028, except fertilisers, which have 1% from 2026; 2026/1740 deleted the tables' marked-up columns to avoid rounding inconsistencies, so the mark-up is applied to the base value; the mark-up applies to goods other than electricity; electricity default values are set separately, based on the emission factor of the electricity grid of the country of origin; the default values and mark-ups must be revised by December 2027 at the latest
  article: Implementing Regulation (EU) 2025/2621, Annexes I and IV, as corrected by Implementing Regulation (EU) 2026/1740; Regulation (EU) 2023/956, Article 7 and Annex IV
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=OJ%3AL_202601740
  values: {markup_by_year: {2026: 0.10, 2027: 0.20, 2028: 0.30}, fertilisers_markup: 0.01}
  last_checked: 2026-11-20
- id: cbam-verification
  fact: "Actual embedded emissions declared must be verified by a verifier accredited for CBAM by a national accreditation body in the EU, and the accreditation must be valid when the verifier issues the final verification report; the verifier aims at a verification opinion with reasonable assurance that the report is free from material misstatement ('verified as satisfactory'); a physical site visit is required in the first year subject to verification, may be replaced by a virtual visit or waived in a second consecutive year only if a physical visit took place the year before, and should take place at least every two years; materiality levels are 5% of the total specific embedded emissions and 5% of the total specific embedded free allocation, per tonne of each good by CN code"
  article: "Regulation (EU) 2023/956, Articles 8 and 18; Implementing Regulation (EU) 2025/2546, recitals 3 and 5, Articles 2, 3 and 5"
  source: https://eur-lex.europa.eu/eli/reg_impl/2025/2546/oj/eng
  last_checked: 2026-11-21
- id: cbam-actual-or-default
  fact: The declarant may use actual embedded emissions only when the installation operator provides data verified by an accredited verifier; without verified actual data it uses the Commission's default values; actual data for a precursor may be used only from a verification report that covers the period the precursor was produced; for operators the reporting period is the calendar year in which the goods were produced
  article: Regulation (EU) 2023/956, Articles 7 and 8 and Annex IV
  source: https://taxation-customs.ec.europa.eu/system/files/2026-08/Guidance%20No.%201%20-%20Introduction%20to%20CBAM%20concepts.pdf
  last_checked: 2026-11-20
- id: cbam-operator-template-and-portal
  fact: The Commission publishes an operator emissions report template to help installation operators pass embedded emissions data to authorised CBAM declarants; operators of non-EU installations can register in the Operators Portal of the CBAM Registry, which opened in December 2024
  article: Regulation (EU) 2023/956, Article 10; Commission Guidance No. 2 for non-EU operators
  source: https://taxation-customs.ec.europa.eu/system/files/2026-08/Guidance%20No.%202%20-%20Quick%20guide%20for%20non-EU%20operators%20on%20CBAM%20implementation.pdf
  last_checked: 2026-11-20
- id: cbam-carbon-price-paid
  fact: "The declarant may reduce the certificates to surrender by the carbon price effectively paid in the country of origin, net of any rebate or compensation (including free allowances); the documentation must be certified by a person independent of the declarant and of the third country's authorities; where the price effectively paid cannot be determined, yearly default carbon prices may be used, which the Commission may set from 2027; Implementing Regulation (EU) 2026/2498, adopted 5 Nov 2026 and published 16 Nov 2026, sets the evidence, certification, attribution to embedded emissions and conversion into fewer certificates; international carbon credits count only if authorised and issued under Article 6 of the Paris Agreement; for 2026 and 2027 accredited CBAM verifiers may certify the evidence, and from 2028 the certifier needs a specific accreditation from an EU national accreditation body; the operator converts the effective carbon price into euro at the yearly average exchange rate published by the Commission; the reduction per good is (effective carbon price in EUR per tonne of good / yearly reference price of CBAM certificates) x quantity of the good declared, or, with a default carbon price, (default carbon price x specific embedded emissions / reference price) x quantity; the yearly reference price is the average of the published CBAM certificate prices for the year of import, rounded to the nearest cent"
  article: "Regulation (EU) 2023/956, Article 9, as amended by Regulation (EU) 2025/2083; Implementing Regulation (EU) 2026/2498, Articles 3, 6 and 7"
  source: https://eur-lex.europa.eu/eli/reg_impl/2026/2498/oj/eng
  last_checked: 2026-11-21
- id: cbam-carbon-price-report
  fact: "The installation operator draws up a carbon price report in English, on the Commission's electronic template in the CBAM registry, following the method in Annex I of Implementing Regulation (EU) 2026/2498, and sends it to the independent person (through the registry if the operator is registered); the method has five steps per carbon price mechanism: the price per tonne of covered emissions (for an emissions trading system, the weighted average auction price of the reporting period, or the average cost of the operator's own compliance units still held; for a carbon tax, the applicable or reduced rate), minus any monetary refund per tonne; the covered emissions attributed to each good per tonne, as for embedded emissions under Implementing Regulation (EU) 2025/2547; the rebated emissions per tonne of good (free allowances, emissions below a baseline or threshold, other exemptions); price paid per tonne of good = (attributed emissions - rebated emissions) x effective price; conversion into euro at the Commission's yearly average exchange rate and addition across mechanisms and precursors; the reporting period is the one of the verified emissions report; indirect emissions are not attributed to goods listed in Annex II of Regulation (EU) 2023/956 (such as iron and steel); a carbon price on a precursor produced in another installation counts only with that installation's certification report or a default carbon price; international carbon credits under Article 6.2 and 6.4 of the Paris Agreement count for at most 10% of the covered emissions of that mechanism; a rebate the operator is entitled to but cannot evidence removes any deduction; the report contents are listed in Annex III; the independent person, who must be independent of the operator, the EU competent authority, the Commission and the third-country authority responsible for the mechanism, certifies the report as satisfactory or unsatisfactory, relying on a satisfactory verification report for the same period, and from 1 February 2027 issues the certification report in the CBAM registry"
  article: "Implementing Regulation (EU) 2026/2498, Articles 3, 8, 9, 10(2), 15 and 19, Annex I (sections 2 to 7) and Annex III"
  source: https://eur-lex.europa.eu/eli/reg_impl/2026/2498/oj/eng
  last_checked: 2026-11-21
- id: cbam-free-allocation-adjustment
  fact: "Certificates to surrender are adjusted for EU ETS free allocation to EU producers of the same goods; the adjustment uses a CBAM benchmark per CN code, the cross-sectoral correction factor and the CBAM factor, is set by Implementing Regulation (EU) 2025/2620, and is zero for electricity; the CBAM factor is 97.5% (2026), 95% (2027), 90% (2028), 77.5% (2029), 51.5% (2030), 39% (2031), 26.5% (2032), 14% (2033) and none from 2034; per good, the adjustment is the specific embedded free allocation (SEFA) times the mass imported; with default values, SEFA = CBAM factor x cross-sectoral correction factor x the default CBAM benchmark for the CN code and country of origin (Annex point 5, column B); with actual data, the process-level free allocation (CBAM factor x cross-sectoral correction factor x the process benchmark, column A) plus, for complex goods, the SEFA of each precursor times its specific mass consumed"
  article: "Regulation (EU) 2023/956, Article 31; Directive 2003/87/EC, Article 10a(1a); Implementing Regulation (EU) 2025/2620, Articles 1 to 4 and Annex points 2 to 4"
  source: https://eur-lex.europa.eu/eli/reg_impl/2025/2620/oj/eng
  values: {cbam_factor_by_year: {2026: 0.975, 2027: 0.95, 2028: 0.9, 2029: 0.775, 2030: 0.515, 2031: 0.39, 2032: 0.265, 2033: 0.14, 2034: 0.0}}
  last_checked: 2026-11-21
- id: cbam-certificates
  fact: Certificate sales from 1 Feb 2027 on the common central platform; price from EU ETS auctions weighted by auction volume; for 2026 imports, the quarterly average for the quarter in which the goods were imported; weekly average from 1 Jan 2027
  article: Regulation (EU) 2023/956, Articles 20 and 21, as amended
  source: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/price-cbam-certificates_en
  last_checked: 2026-11-20
- id: cbam-quarterly-holding
  fact: "From 2027, at the end of each quarter the declarant must hold certificates for at least 50% of embedded emissions in goods imported since the start of the year, measured with default values without mark-up or with the previous year's surrendered certificates, taking into account the free allocation adjustment; an importer must meet this obligation by the end of the quarter following the one in which it exceeds the 50-tonne threshold; Article 22 sets no rounding rule for the number of certificates"
  article: "Regulation (EU) 2023/956, Article 22(1), (2) and (2a), as amended by Regulation (EU) 2025/2083"
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20/eng
  values: {from_year: 2027, min_share: 0.5}
  last_checked: 2026-11-21
- id: cbam-declaration
  fact: First annual declaration and surrender due 30 Sep 2027 for 2026 imports
  article: Regulation (EU) 2023/956, Articles 6(1) and 22(1), as amended
  source: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en
  last_checked: 2026-11-20
- id: cbam-declaration-content
  fact: "The annual declaration states the total quantity of each type of goods imported in the previous year (in tonnes, or MWh for electricity), including goods imported below the 50-tonne threshold; their total embedded emissions; the number of certificates to surrender (after the carbon-price-paid reduction and the free allocation adjustment); and copies of verification reports where actual values are used; implementing acts set the standard format, including detail for each installation, country of origin and type of goods"
  article: "Regulation (EU) 2023/956, Article 6(1), (2) and (6), as amended by Regulation (EU) 2025/2083"
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20/eng
  last_checked: 2026-11-21
- id: cbam-review
  fact: "The Commission, and the competent authority, may review a CBAM declaration until the end of the fourth year after the year it should have been submitted; where the competent authority concludes that too few certificates were declared, it notifies the declarant, who must surrender the additional certificates within one month; certificates surrendered in excess are repurchased"
  article: "Regulation (EU) 2023/956, Article 19, as amended by Regulation (EU) 2025/2083"
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20/eng
  last_checked: 2026-11-21
- id: cbam-penalties
  fact: A declarant that does not surrender enough certificates by 30 Sep pays, per missing certificate, the EU ETS excess emissions penalty (Directive 2003/87/EC, Article 16(3) and (4)) of the import year, and must still surrender them; an importer without authorisation that exceeds the threshold faces a penalty on all embedded emissions of that year, at least the same per tonne, which may be reduced where the threshold was exceeded by no more than 10%
  article: Regulation (EU) 2023/956, Article 26(1), (1a), (2a) and (3), as amended by Regulation (EU) 2025/2083
  source: https://eur-lex.europa.eu/eli/reg/2025/2083/oj/eng
  last_checked: 2026-11-20
- id: cbam-records
  fact: The authorised CBAM declarant keeps records of the information used to calculate embedded emissions, including the verifier's report, until the end of the fourth year after the year the CBAM declaration was or should have been submitted
  article: Regulation (EU) 2023/956, Article 7(6)
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20
  values: {retention_years_after_declaration_year: 4}
  last_checked: 2026-11-20
- id: cbam-carbon-price-records
  fact: Documents supporting a reduction for carbon price paid abroad are kept until the end of the fourth year after the year in which the independent person certified them
  article: Regulation (EU) 2023/956, Article 9(3), as amended by Regulation (EU) 2025/2083
  source: https://eur-lex.europa.eu/eli/reg/2023/956/2025-10-20
  last_checked: 2026-11-20

# --- Scope 3 (GHG Protocol and ESRS E1) ---
- id: ghgp-scope3-standard
  fact: The GHG Protocol Corporate Value Chain (Scope 3) Standard (2011) is the current version; a revision is under way (Phase 1 progress update March 2026), with a consolidated draft for public consultation estimated for Q2 2027 (Standard Development Plan v2.0, 29 July 2026); the revised standard will be published jointly with ISO; the GHG Protocol accepts feedback only during the formal consultation
  article: GHG Protocol Standard Development Plan v2.0; Scope 3 Phase 1 Progress Update, March 2026
  source: https://ghgprotocol.org/sites/default/files/2026-07/Consolidated-StandardDevelopmentPlan(SDP)-2026.07.29.pdf
  last_checked: 2026-11-20
- id: ghgp-organisational-boundary
  fact: Under the GHG Protocol Corporate Standard a company sets its organisational boundary with one consolidation approach, applied consistently - equity share (emissions in proportion to its equity share, whether or not it controls the operation), financial control (100% of operations it financially controls, none where it lacks financial control) or operational control (100% of operations where it has full authority to introduce and implement operating policies); Scope 3 then covers value-chain emissions outside that boundary; a revision proposal (December 2025, not final) would require control-based reporting, recommend financial control and drop equity share
  article: GHG Protocol Corporate Accounting and Reporting Standard, organisational boundaries (cited, not copied); Corporate Standard Phase 1 Progress Update, December 2025
  source: https://ghgprotocol.org/sites/default/files/2025-12/CS-Phase1-ProgressUpdate.pdf
  last_checked: 2026-11-20
- id: ghgp-scope3-categories
  fact: "The Scope 3 Standard groups value-chain emissions into 15 categories, 8 upstream (1-8) and 7 downstream (9-15); a company screens all 15 and explains any exclusion. Categories: 1 purchased goods and services, 2 capital goods, 3 fuel- and energy-related activities, 4 upstream transportation and distribution (transport and storage services bought from third parties), 5 waste generated in operations, 6 business travel, 7 employee commuting, 8 upstream leased assets, 9 downstream transportation and distribution (including retail storage), 10 processing of sold products, 11 use of sold products, 12 end-of-life treatment of sold products, 13 downstream leased assets, 14 franchises, 15 investments"
  article: GHG Protocol Corporate Value Chain (Scope 3) Standard (cited, not copied)
  source: https://ghgprotocol.org/corporate-value-chain-scope-3-standard
  last_checked: 2026-11-20
- id: ghgp-scope3-reporting
  fact: "The Scope 3 categories are designed to be mutually exclusive; where a company finds possible double counting between or within categories, it should report the emissions from the activity only once, explain where they are reported and cross-refer; biogenic CO2 emissions in the value chain are not included in the scopes but are reported separately for each category; for each category the company describes the types and sources of data, including activity data, emission factors and global warming potential (GWP) values, and the data quality"
  article: "GHG Protocol Corporate Value Chain (Scope 3) Standard, chapters 5 and 11 (cited, not copied)"
  source: https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf
  last_checked: 2026-11-21
- id: desnz-2026-gwp
  fact: "The 2026 UK Government (DESNZ) GHG conversion factors express methane and nitrous oxide as CO2e with GWP values from the IPCC Fifth Assessment Report (AR5: CH4 28, N2O 265), consistent with UNFCCC reporting; the methodology report lists some factors still on an AR4 basis (for example well-to-tank bioenergy) and refrigerants on AR5, or AR6 where no AR5 value exists"
  article: "DESNZ, 2026 Government GHG Conversion Factors, methodology report, paragraphs 1.9 and 1.21, Table 1"
  source: https://assets.publishing.service.gov.uk/media/6a2940543b15d05a7ce3202e/2026-GHG-conversion-factors-methodology-report.pdf
  last_checked: 2026-11-21
- id: ghgp-base-year
  fact: "A company chooses a base year and a base-year recalculation policy; under the Scope 3 Standard it establishes and discloses the significance threshold that triggers a recalculation (the threshold may be quantitative or qualitative; guidance gives 2% as an example); recalculation is triggered by significant structural changes, changes in calculation methodology or data sources, and the discovery of significant errors, including several errors that are significant together; after a significant method change the base year is recalculated with the new method; a structural change during the year is applied to the base year for the whole year; the Corporate Standard's base-year rules are under revision"
  article: GHG Protocol Corporate Standard, chapter 5, and Scope 3 Standard (cited, not copied); Corporate Standard working group materials 2025
  source: https://ghgprotocol.org/sites/default/files/standards/Corporate-Value-Chain-Accounting-Reporing-Standard_041613_2.pdf
  last_checked: 2026-11-20
- id: ghgp-land-sector
  fact: "The GHG Protocol Land Sector and Removals (LSR) Standard was published on 30 January 2026 (current version v1.1, June 2026, with companion guidance on agriculture and CO2 removal) and takes effect on 1 January 2027; it is used together with the Corporate and Scope 3 Standards and covers land emissions, land-use change emissions and removals, including in the value chain; the GHG Protocol says reports made in 2028 on 2027 data need to comply with it"
  article: GHG Protocol Land Sector and Removals Standard v1.1 and FAQ (cited, not copied)
  source: https://ghgprotocol.org/land-sector-and-removals-standard
  last_checked: 2026-11-20
- id: jcgm-gum
  fact: "The Guide to the expression of uncertainty in measurement (GUM), JCGM 100:2008, sets general rules for evaluating and expressing measurement uncertainty; its Supplement 1, JCGM 101:2008, propagates probability distributions through a measurement model by a Monte Carlo method and is being revised as JCGM GUM-7; both are free to download from the BIPM, but copyright stays with the JCGM member organisations, so they are cited, not copied"
  article: JCGM 100:2008; JCGM 101:2008
  source: https://www.bipm.org/en/doi/10.59161/jcgm100-2008e
  last_checked: 2026-11-20
- id: esrs-e1-scope2
  fact: "Revised ESRS E1 (Disclosure Requirement E1-8) asks for gross Scope 2 GHG emissions on both a location-based and a market-based basis, alongside Scope 1 and each significant Scope 3 category"
  article: "Delegated Regulation (EU) 2026/1563, Annex I, ESRS E1, E1-8, paragraph 30(a)"
  source: https://eur-lex.europa.eu/eli/reg_del/2026/1563/oj/eng
  last_checked: 2026-11-21
- id: esrs-e1-scope3
  fact: Revised ESRS E1 requires gross Scope 3 GHG emissions as a total and for each significant Scope 3 category; significant categories are identified by the magnitude of their estimated emissions and other criteria such as spend, influence, transition risks and opportunities, or stakeholder views; screening uses the 15 GHG Protocol categories (ISO 14064-1 is an alternative); the significant categories are updated each year and the full inventory at least every three years or after a significant event; the GHG Protocol's Scope 3 calculation provisions can be considered; applies to financial years from 1 January 2027
  article: Delegated Regulation (EU) 2026/1563, Annex (ESRS E1 Scope 3 disclosure, AR 24 and AR 46)
  source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1563
  last_checked: 2026-11-20
