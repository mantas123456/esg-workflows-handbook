  - {id: B8-40a, disclosure: B8, reference: "Para 40(a)", description: "Number of employees by type of contract", small: true, large: true}
  - {id: B8-40b, disclosure: B8, reference: "Para 40(b)", description: "Number of employees by gender", small: true, large: true}
