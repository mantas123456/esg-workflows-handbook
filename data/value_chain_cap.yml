# The value-chain cap: the datapoints listed in Annex II of Delegated Regulation (EU)
# 2026/1560 (OJ L, 21.9.2026), in the handbook's own short words. A company reporting
# under the CSRD may not require more than these from a value-chain undertaking with
# on average 1,000 employees or fewer (fact csrd-value-chain-cap).
#
# id:          disclosure plus paragraph reference
# small:       in the cap for undertakings with 10 employees or fewer
# large:       in the cap for undertakings with more than 10 employees
# Last checked: 2026-11-21 against the Official Journal text.
source: https://eur-lex.europa.eu/eli/reg_del/2026/1560/oj/eng
applies_from: financial years beginning on or after 1 January 2027 (Article 3, Article 4)

datapoints:
