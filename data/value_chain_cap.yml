  - {id: B1-27e, disclosure: B1, reference: "Para 27(e)(i) to (vii)", description: "General information about the undertaking", small: true, large: true}
  - {id: B3-32, disclosure: B3, reference: "Para 32, first sentence", description: "Total energy consumption in MWh", small: false, large: true}
