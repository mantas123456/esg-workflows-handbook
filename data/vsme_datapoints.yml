# VSME datapoints: the voluntary standard, Delegated Regulation (EU) 2026/1560, Annex I.
# Short descriptions are this handbook's own words, not the standard's text.
#
# id:          disclosure code (B1-B11, C1-C9), with a suffix for each metric
# module:      basic | comprehensive
# unit:        unit of the value, or "text" for a narrative disclosure
# dataset:     the matching dataset in data/datasets.yml, or null if the handbook
#              has no dataset for it yet
# basis:       where the detail was checked:
#                act      - confirmed for the 2026 act
#                rec-2025 - checked in Recommendation (EU) 2025/1710; the 2026 act keeps
#                           the structure, its detailed wording not re-read
#                title    - only the disclosure's title or topic was checked
# Last checked: 2026-11-20. See data/regulations.yml (vsme, vsme-modules, vsme-basic-metrics).

datapoints:
  # ---------------- Basic Module ----------------
  - {id: B1-option, module: basic, disclosure: B1, description: "Which option is used: Basic only (A) or Basic and Comprehensive (B), with a statement of compliance", unit: text, dataset: null, basis: act}
  - {id: B1-basis, module: basic, disclosure: B1, description: "Basis for preparation: consolidated or individual, the entities and sites covered", unit: text, dataset: null, basis: title}
  - {id: B2-practices, module: basic, disclosure: B2, description: "Practices, policies and future plans for moving towards a more sustainable economy", unit: text, dataset: null, basis: title}
  - {id: B3-energy, module: basic, disclosure: B3, description: "Total energy consumption, split into renewable and non-renewable where the data can be obtained", unit: MWh, dataset: electricity_use, basis: rec-2025}
  - {id: B3-energy-fuels, module: basic, disclosure: B3, description: "Energy from fuels, part of total energy consumption", unit: MWh, dataset: fuel_use, basis: rec-2025}
  - {id: B3-scope1, module: basic, disclosure: B3, description: "Gross Scope 1 GHG emissions, following the GHG Protocol Corporate Standard", unit: tCO2e, dataset: fuel_use, basis: rec-2025}
  - {id: B3-scope2-location, module: basic, disclosure: B3, description: "Gross location-based Scope 2 GHG emissions", unit: tCO2e, dataset: electricity_use, basis: rec-2025}
  - {id: B3-intensity, module: basic, disclosure: B3, description: "GHG intensity: total GHG emissions divided by turnover", unit: tCO2e per EUR, dataset: null, basis: rec-2025}
  - {id: B4-pollution, module: basic, disclosure: B4, description: "Emissions of pollutants to air, water and soil, where the undertaking already reports them under law or an environmental management system", unit: kg, dataset: null, basis: title}
  - {id: B5-sensitive-sites, module: basic, disclosure: B5, description: "Number and area of sites owned, leased or managed in or near biodiversity-sensitive areas", unit: count and ha, dataset: null, basis: rec-2025}
  - {id: B5-land-use, module: basic, disclosure: B5, description: "Land use: total, sealed and nature-oriented area (optional)", unit: ha, dataset: null, basis: rec-2025}
  - {id: B6-water-consumption, module: basic, disclosure: B6, description: "Water consumption (withdrawal minus discharge), for undertakings whose production uses water significantly", unit: m3, dataset: null, basis: rec-2025}
  - {id: B7-waste, module: basic, disclosure: B7, description: "Waste generated, split into hazardous and non-hazardous", unit: t, dataset: null, basis: rec-2025}
  - {id: B7-waste-recycled, module: basic, disclosure: B7, description: "Waste diverted to recycling or reuse", unit: t, dataset: null, basis: rec-2025}
  - {id: B8-employees, module: basic, disclosure: B8, description: "Employees by contract type (permanent or temporary), gender and, if in more than one country, by country", unit: headcount or FTE, dataset: headcount, basis: rec-2025}
  - {id: B8-turnover-rate, module: basic, disclosure: B8, description: "Employee turnover rate, for undertakings with 50 or more employees", unit: "%", dataset: headcount, basis: rec-2025}
  - {id: B9-accidents, module: basic, disclosure: B9, description: "Number and rate of recordable work-related accidents (per 100 full-time workers, based on 2,000 hours a year)", unit: count and rate, dataset: null, basis: rec-2025}
  - {id: B9-fatalities, module: basic, disclosure: B9, description: "Fatalities from work-related injuries and ill health", unit: count, dataset: null, basis: rec-2025}
  - {id: B10-pay-gap, module: basic, disclosure: B10, description: "Gender pay gap (may be left out below 150 employees; below 100 from 7 June 2031)", unit: "%", dataset: null, basis: rec-2025}
  - {id: B10-collective-bargaining, module: basic, disclosure: B10, description: "Share of employees covered by collective bargaining agreements", unit: "%", dataset: null, basis: rec-2025}
  - {id: B10-training, module: basic, disclosure: B10, description: "Average annual training hours per employee, by gender", unit: hours, dataset: null, basis: rec-2025}
  - {id: B11-corruption, module: basic, disclosure: B11, description: "Convictions and total fines for breaches of anti-corruption and anti-bribery laws", unit: count and EUR, dataset: null, basis: rec-2025}

  # ---------------- Comprehensive Module (topic level; detail in 4.1) ----------------
  - {id: C1-business-model, module: comprehensive, disclosure: C1, description: "Business model and sustainability-related initiatives (some parts voluntary for 10 employees or fewer)", unit: text, dataset: null, basis: act}
  - {id: C2-practices, module: comprehensive, disclosure: C2, description: "More detail on the practices, policies and future plans reported in B2", unit: text, dataset: null, basis: title}
  - {id: C3-targets, module: comprehensive, disclosure: C3, description: "GHG reduction targets and climate transition", unit: text and tCO2e, dataset: null, basis: rec-2025}
  - {id: C4-climate-risks, module: comprehensive, disclosure: C4, description: "Climate-related hazards and transition risks, and how the undertaking responds", unit: text, dataset: null, basis: rec-2025}
  - {id: C5-workforce, module: comprehensive, disclosure: C5, description: "More characteristics of the workforce", unit: various, dataset: headcount, basis: title}
  - {id: C6-human-rights-policies, module: comprehensive, disclosure: C6, description: "Human rights policies and processes for the own workforce", unit: text, dataset: null, basis: title}
  - {id: C7-human-rights-incidents, module: comprehensive, disclosure: C7, description: "Human rights incidents involving the workforce or the value chain", unit: text and count, dataset: null, basis: act}
  - {id: C8-revenues, module: comprehensive, disclosure: C8, description: "Revenues from certain activities", unit: EUR, dataset: null, basis: act}
  - {id: C9-board-gender, module: comprehensive, disclosure: C9, description: "Gender diversity ratio in the governance body", unit: ratio, dataset: null, basis: act}

