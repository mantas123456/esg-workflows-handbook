site_name: ESG Workflows Handbook
site_description: Free, practical step-by-step workflows for CBAM, Scope 3, VSME and CSRD/ESRS, with templates and tools.
site_author: Mantas Valantinavicius
site_url: https://mantas123456.github.io/esg-workflows-handbook/
repo_url: https://github.com/mantas123456/esg-workflows-handbook
repo_name: mantas123456/esg-workflows-handbook
edit_uri: edit/main/docs/
copyright: >-
  Text and templates: CC BY 4.0 · Code: MIT ·
  Not legal advice; the regulation and the competent authority take priority.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  status:
    planned: "Planned: not written yet"
    draft: "Draft: written, not yet reviewed"
    examples-checked: "Examples checked: numbers re-run by code on every build"
    reviewed: "Reviewed: checked by a practitioner"

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  _chapter_template.md

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

