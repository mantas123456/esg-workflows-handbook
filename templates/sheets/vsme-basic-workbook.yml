title: VSME Basic Module workbook
type: Workbook
description: One row per Basic Module datapoint of the voluntary standard, with the value, its source, an owner and a status, and completeness tracked overall and by disclosure.
instructions:
  - "The datapoint rows come from the handbook's list of the voluntary standard's Basic Module (Delegated Regulation (EU) 2026/1560, Annex I), in the handbook's own words. Read Annex I for the exact requirements."
  - "For each datapoint enter the value with its unit, the source document and who provides it, and choose a status."
  - "Status: Collected or Not applicable count as done; In progress and Not started do not. Write the reason in the source column when you choose Not applicable."
  - "By disclosure and Completeness calculate themselves."
  - "Grey example values are the fictional Gozo Fresh Foods (see V2 in the handbook)."
sheets:
  - name: Basic
    prefill:
      file: data/vsme_datapoints.yml
      key: datapoints
      where: {module: basic}
      fields: [id, disclosure, description, unit]
      examples: {file: data/examples/gozo_fresh_foods.yml, key: vsme_status}
    columns:
      - {header: Datapoint, width: 22}
      - {header: Disclosure, width: 9}
      - {header: What it covers (handbook's own words), width: 44}
      - {header: Unit, width: 13}
      - {header: Value, width: 22}
      - {header: Source document, width: 24}
      - {header: Owner, width: 13}
      - {header: Status, width: 13, choices: [Collected, Not applicable, In progress, Not started]}
      - {header: "Done (1/0)", width: 7, formula: '=IF(A{r}="","",IF(OR(H{r}="Collected",H{r}="Not applicable"),1,0))'}
    highlights:
      - {formula: '$I2=0', color: FFF9C4}
  - name: By disclosure
    prefill:
      file: data/vsme_datapoints.yml
      key: disclosures
      where: {module: basic}
      fields: [disclosure, topic]
    columns:
      - {header: Disclosure, width: 10}
      - {header: Topic, width: 44}
      - {header: Datapoints, width: 10, formula: '=COUNTIF(Basic!$B$2:$B$60,A{r})'}
      - {header: Done, width: 8, formula: '=SUMIF(Basic!$B$2:$B$60,A{r},Basic!$I$2:$I$60)'}
      - {header: Complete, width: 10, format: percent, formula: '=IF(C{r}=0,"",D{r}/C{r})'}
  - name: Completeness
    kind: summary
    rows:
      - {label: Basic Module datapoints, formula: '=COUNTA(Basic!A2:A60)'}
      - {label: Done (collected or not applicable), formula: '=SUM(Basic!I2:I60)'}
      - {label: Complete, bold: true, formula: '=IF(B1=0,"",B2/B1)', format: "0.0%"}
